name: Publish verified OpenXeChain toolchain release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download verified run 20 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p release
          gh run download 36198042207 \
            --repo "$GITHUB_REPOSITORY" \
            --name openxechain-x360-toolchain-20 \
            --dir release
          find release -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Verify preserved toolchain and XEX2 smoke
        run: |
          set -euxo pipefail
          TOOLCHAIN=release/openxechain-x360-toolchain.tar.xz
          HELLO=release/out/hello.xex
          test -f "$TOOLCHAIN"
          test -f "$HELLO"

          TOOLCHAIN_SHA=$(sha256sum "$TOOLCHAIN" | awk '{print $1}')
          HELLO_SHA=$(sha256sum "$HELLO" | awk '{print $1}')
          test "$TOOLCHAIN_SHA" = "c71a1a4586a2eb1741c632b164ad74e90532cdb7bf0851774544998b35312d37"
          test "$HELLO_SHA" = "b5a74eb8781411d03ec7ee16d4c54736a68b890f0dd0bf4545121d097faaf7a5"
          test "$(head -c 4 "$HELLO")" = "XEX2"

          tar -tJf "$TOOLCHAIN" > release/toolchain-files.txt
          for required in \
            xenon/bin/clang \
            xenon/bin/lld-link \
            xenon/bin/synthxex \
            xenon/bin/llvm-dlltool \
            xenon/lib/xecorelib.a \
            xenon/ppc-xbox360/lib/libc.a \
            xenon/lib/generic/libclang_rt.builtins-powerpc.a
          do
            grep -Fx "$required" release/toolchain-files.txt
          done

          cat > release/BUILD_INFO.txt <<EOF
          PMCN Studios OpenXeChain Xbox 360 toolchain
          Verified GitHub Actions run: #20
          Run ID: 36198042207
          Builder commit: f8c4cd14b45259485da7935c61d8bdfab5bf5b59
          OpenXeChain buildscript pin: eed1fa65bf9577fd31625764b320a90182ea9ade
          Toolchain SHA-256: $TOOLCHAIN_SHA
          hello.xex SHA-256: $HELLO_SHA
          hello.xex magic: XEX2
          SynthXEX version in smoke log: 0.0.6
          EOF

          cat > release/RELEASE_NOTES.md <<'EOF'
          Verified reusable OpenXeChain toolchain for Xbox 360, built by GitHub Actions.

          Verification:
          - full OpenXeChain build completed successfully;
          - Clang/LLVM, xecorelib, Newlib, compiler-rt and SynthXEX completed;
          - smoke C source compiled for ppc32-xbox360;
          - SynthXEX produced hello.xex;
          - hello.xex begins with the XEX2 magic;
          - toolchain archive and smoke XEX hashes were independently rechecked before this release.

          This is a development toolchain, not Super Mario 64 game content.
          EOF

      - name: Create or refresh permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="openxechain-x360-toolchain-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/openxechain-x360-toolchain.tar.xz \
              release/openxechain-x360-toolchain.sha256 \
              release/out/hello.xex \
              release/BUILD_INFO.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenXeChain Xbox 360 Toolchain v1" \
              --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              release/openxechain-x360-toolchain.tar.xz \
              release/openxechain-x360-toolchain.sha256 \
              release/out/hello.xex \
              release/BUILD_INFO.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OpenXeChain Xbox 360 Toolchain v1" \
              --notes-file release/RELEASE_NOTES.md
          fi
